</style></head><body><header class="hero"><div class="eyebrow">The official conference programme</div><h1>Future of Events<br>Summit 2027</h1><p>12–14 May 2027 · Toronto, Ontario, Canada · All times Eastern Daylight Time (Toronto)</p></header><main class="wrap"><div class="toolbar"><nav class="views" aria-label="Main agenda navigation"><button class="btn active" id="fullNav" type="button">Full Agenda</button><button class="btn" id="mineNav" type="button">My Agenda <span id="savedCount">(0)</span></button></nav><div class="views" id="viewSwitch"><button class="btn active" id="listBtn" type="button">List View</button><button class="btn" id="calBtn" type="button">Calendar View</button></div></div><div id="status" class="status" role="status" aria-live="polite">Loading the latest published programme…</div><div class="daybar" id="days" role="group" aria-label="Conference day"></div><section id="filterPanel" class="filters" aria-label="Search and filters"><label class="search">Search sessions, presentations and speakers<input id="search" type="search" placeholder="Search the programme…"></label><label>Track<select id="track"></select></label><label>Room<select id="room"></select></label><label>Session type<select id="type"></select></label><label>Audience level<select id="audience"></select></label><button class="btn" id="clear" type="button">Clear Filters</button></section><div id="meta" class="count" aria-live="polite"></div><div id="conflicts" aria-live="polite"></div><div id="content"></div><div class="footer">Future of Events Summit 2027 · Programme times are shown in America/Toronto.</div></main><dialog class="modal" id="details" aria-labelledby="detailTitle"><div class="modal-head"><div><div class="eyebrow">Session details</div><h2 id="detailTitle"></h2></div><button class="close" id="closeModal" aria-label="Close session details">×</button></div><div class="modal-body" id="detailBody"></div></dialog><script>
'use strict';
const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vRgvlltS4_BP2icXAbtl09E84eHWbFrf5LFIJa1575j_8qlVngOlcdZVDUpktIcmcNkUtgBhC6zD3RK/pub?gid=0&single=true&output=csv';
const DAYS=['2027-05-12','2027-05-13','2027-05-14'], STORAGE='fes2027:saved-session-ids:v1', CACHE='fes2027:last-validated-csv:v1';
const FIELDS=['Session ID','Date','Session Start Time','Session End Time','Session Title','Presentation ID','Presentation Title','Participation ID'];
const $=id=>document.getElementById(id), state={sessions:[],saved:new Set(),day:'all',view:'list',area:'full',loaded:false,offline:false};
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
const add=(parent,...children)=>{for(const c of children)if(c)parent.append(c);return parent};
const dateLabel=d=>new Intl.DateTimeFormat('en-CA',{weekday:'long',month:'long',day:'numeric',timeZone:'UTC'}).format(new Date(d+'T12:00:00Z'));
const minute=t=>{const m=/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/.exec(t||'');if(!m||+m[1]>23||+m[2]>59||+(m[3]||0)>59)throw Error('Invalid time: '+t);return +m[1]*60 + +m[2]+ +(m[3]||0)/60};
const clock=t=>{if(!t)return '';const m=minute(t);return `${Math.floor(m/60)%12||12}:${String(Math.floor(m%60)).padStart(2,'0')} ${m<720?'AM':'PM'}`};
const order=(a,b)=>a.date.localeCompare(b.date)||minute(a.start)-minute(b.start)||a.id.localeCompare(b.id);
const safeStorage={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch{return false}}};
try{const v=JSON.parse(safeStorage.get(STORAGE)||'[]');if(Array.isArray(v))state.saved=new Set(v.filter(x=>typeof x==='string'))}catch{}
function csvParse(text){text=text.replace(/^\uFEFF/,'');const rows=[];let row=[],field='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){field+='"';i++}else if(c==='"')quoted=false;else field+=c}else if(c==='"'){if(field!=='')throw Error('Malformed CSV quoting');quoted=true}else if(c===','){row.push(field);field=''}else if(c==='\r'||c==='\n'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(x=>x!==''))rows.push(row);row=[];field=''}else field+=c}if(quoted)throw Error('Unterminated quoted CSV field');if(field!==''||row.length){row.push(field);rows.push(row)}return rows}
function group(text){const raw=csvParse(text);if(raw.length<2)throw Error('The published CSV is empty or has no programme rows.');const headers=raw.shift().map(x=>x.trim());if(new Set(headers).size!==headers.length)throw Error('Duplicate CSV column headings.');const missing=FIELDS.filter(x=>!headers.includes(x));if(missing.length)throw Error('Missing required columns: '+missing.join(', '));const rows=raw.map((r,i)=>{if(r.length!==headers.length)throw Error('CSV row '+(i+2)+' has '+r.length+' columns; expected '+headers.length);return Object.fromEntries(headers.map((h,j)=>[h,r[j].trim()]))});const sessions=new Map(),participations=new Map(),presentations=new Map();for(const r of rows){const sid=r['Session ID'],pid=r['Presentation ID'],iid=r['Participation ID'];if(!sid||!pid||!iid)throw Error('Missing identifier in programme row.');const date=r.Date,start=r['Session Start Time'],end=r['Session End Time'];if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!DAYS.includes(date))throw Error('Unexpected conference date: '+date);if(minute(end)<=minute(start))throw Error('Session has invalid start/end: '+sid);if(r.Timezone&&r.Timezone!=='America/Toronto')throw Error('Unexpected timezone for '+sid);if(!r['Session Title'])throw Error('Session title missing: '+sid);const sessionProps={date,start,end,title:r['Session Title'],type:r['Session Type']||'',track:r.Track||'',room:r.Room||'',description:r['Session Description']||''};let s=sessions.get(sid);if(!s){s={id:sid,...sessionProps,presentations:new Map(),audiences:new Set()};sessions.set(sid,s)}else for(const [k,v]of Object.entries(sessionProps))if(s[k]!==v)throw Error('Conflicting session '+sid+' field '+k);if(r['Audience Level'])s.audiences.add(r['Audience Level']);const pprops={title:r['Presentation Title'],start:r['Presentation Start Time']||'',end:r['Presentation End Time']||''};if(pprops.start&&pprops.end&&(minute(pprops.end)<=minute(pprops.start)||minute(pprops.start)<minute(start)||minute(pprops.end)>minute(end)))throw Error('Presentation outside session: '+pid);if(Boolean(pprops.start)!==Boolean(pprops.end))throw Error('Incomplete presentation time: '+pid);const old=presentations.get(pid);if(old&&old.sid!==sid)throw Error('Presentation '+pid+' assigned to multiple sessions');if(old){for(const [k,v]of Object.entries(pprops)){if(old[k]!==v)throw Error('Conflicting presentation '+pid+' field '+k)}}else{presentations.set(pid,{sid,...pprops})}let p=s.presentations.get(pid);if(!p){p={id:pid,...pprops,people:[],audiences:new Set()};s.presentations.set(pid,p)}if(r['Audience Level'])p.audiences.add(r['Audience Level']);const person={id:iid,name:r['Presenter Name']||'',affiliation:r['Presenter Affiliation']||'',role:r['Presenter Role']||''};const prior=participations.get(iid);if(prior){if(JSON.stringify(prior)!==JSON.stringify({sid,pid,...person}))throw Error('Conflicting participation identifier: '+iid);continue}participations.set(iid,{sid,pid,...person});if(person.name&&!p.people.some(x=>x.name===person.name&&x.role===person.role&&x.affiliation===person.affiliation))p.people.push(person)}return [...sessions.values()].map(s=>({...s,presentations:[...s.presentations.values()].sort((a,b)=>(a.start?minute(a.start):0)-(b.start?minute(b.start):0)||a.id.localeCompare(b.id)),audiences:[...s.audiences]})).sort(order)}
function status(msg,kind=''){const n=$('status');n.hidden=false;n.className='status '+kind;n.replaceChildren(document.createTextNode(msg));if(kind==='error'){const retry=el('button','btn','Retry');retry.style.marginLeft='12px';retry.addEventListener('click',load);n.append(retry)}}
async function load(){status('Loading the latest published programme…');try{const u=new URL(CSV_URL);u.searchParams.set('_refresh',Date.now());const response=await fetch(u.toString(),{cache:'no-store',redirect:'follow'});if(!response.ok)throw Error('HTTP '+response.status);const text=await response.text();if(/^\s*<(?:!doctype|html)/i.test(text))throw Error('The URL returned HTML rather than CSV. Check publishing permissions.');const sessions=group(text);state.sessions=sessions;state.loaded=true;state.offline=false;safeStorage.set(CACHE,JSON.stringify({text,when:Date.now()}));status(`Live programme loaded: ${sessions.length} sessions. Last checked ${new Date().toLocaleTimeString()}.`);render()}catch(e){let recovered=false;try{const cache=JSON.parse(safeStorage.get(CACHE)||'null');if(cache&&cache.text){state.sessions=group(cache.text);state.loaded=true;state.offline=true;status('Live update unavailable ('+e.message+'). Showing previously downloaded programme from '+new Date(cache.when).toLocaleString()+'. It may be outdated.','warn');const retry=el('button','btn','Retry live data');retry.style.marginLeft='12px';retry.onclick=load;$('status').append(retry);recovered=true;render()}}catch{}if(!recovered){state.loaded=false;state.sessions=[];status('Unable to load the live programme: '+e.message+'. Check your connection, published CSV permissions, and browser CORS settings.','error');$('content').replaceChildren();$('meta').textContent=''}}}
const filterIds=['search','track','room','type','audience'];function setupFilters(){for(const [id,key]of [['track','track'],['room','room'],['type','type'],['audience','audiences']]){const node=$(id),old=node.value;node.replaceChildren(new Option('All '+(id==='type'?'session types':id==='audience'?'audience levels':id+'s'),'all'));const values=[...new Set(state.sessions.flatMap(s=>key==='audiences'?s.audiences:[s[key]]).filter(Boolean))].sort();for(const v of values)node.add(new Option(v,v));node.value=values.includes(old)?old:'all'}}
function matches(s){const q=$('search').value.trim().toLocaleLowerCase();const hay=[s.title,s.description,...s.presentations.flatMap(p=>[p.title,...p.people.flatMap(x=>[x.name,x.affiliation])])].join(' ').toLocaleLowerCase();return (!q||hay.includes(q))&&(['track','room','type'].every(id=>$(id).value==='all'||s[id]===$(id).value))&&($('audience').value==='all'||s.audiences.includes($('audience').value)||s.presentations.some(p=>p.audiences.has($('audience').value)))}
function clearFilters(){for(const id of filterIds)$(id).value=id==='search'?'':'all';render()}
function savedButton(s){const yes=state.saved.has(s.id),b=el('button','btn '+(yes?'saved':''),yes?'✓ Saved · Remove':'＋ My Agenda');b.type='button';b.setAttribute('aria-pressed',String(yes));b.addEventListener('click',()=>toggle(s.id));return b}
function toggle(id){if(state.saved.has(id))state.saved.delete(id);else state.saved.add(id);if(!safeStorage.set(STORAGE,JSON.stringify([...state.saved])))status('Your selections will last for this visit, but browser storage is unavailable, so they may not survive a refresh.','warn');render();if($('details').open){const s=state.sessions.find(x=>x.id===id);if(s)openDetail(s,false)}}
function exportButton(s){const b=el('button','btn','↓ Download .ics');b.onclick=()=>downloadIcs([s],s.id+'.ics');return b}
function chips(s){const box=el('div','chips');for(const [v,cls]of [[s.track,'track'],[s.room,''],[s.type,''],[s.audiences.join(' / '),'']])if(v){const c=el('span','chip '+cls,v);if(cls)c.style.setProperty('--track',trackColor(s.track));box.append(c)}return box}
const palette=['#147d81','#7355aa','#bd6726','#3168ad','#a43d73','#597d35','#7b637e'];function trackColor(name){const names=[...new Set(state.sessions.map(s=>s.track).filter(Boolean))].sort();return palette[Math.max(0,names.indexOf(name))%palette.length]}
function sessionCard(s){const c=el('article','session');const time=el('div','time',clock(s.start));add(time,el('small','',`to ${clock(s.end)}`));const body=el('div','content');add(body,chips(s),el('h3','',s.title));if(s.description)add(body,el('p','',s.description.length>190?s.description.slice(0,187)+'…':s.description));const names=[...new Set(s.presentations.flatMap(p=>p.people.map(x=>x.name)).filter(Boolean))];if(names.length)add(body,el('p','muted','Featuring: '+names.join(', ')));const actions=el('div','actions'),detail=el('button','btn primary','View details');detail.onclick=()=>openDetail(s);add(actions,detail,savedButton(s),exportButton(s));add(body,actions);return add(c,time,body)}
function titleDay(d,count){const row=el('div','sectionhead');add(row,el('h2','',dateLabel(d)),el('span','count',count+' session'+(count===1?'':'s')));return row}
function renderList(items,container){for(const d of DAYS){const day=items.filter(s=>s.date===d);if(!day.length)continue;add(container,titleDay(d,day.length));const cards=el('div','cards');day.forEach(s=>cards.append(sessionCard(s)));container.append(cards)}}
function renderCalendar(items,container){for(const d of DAYS){const day=items.filter(s=>s.date===d);if(!day.length)continue;add(container,titleDay(d,day.length));const rooms=[...new Set(state.sessions.filter(s=>s.date===d).map(s=>s.room||'Room not specified'))].sort();const earliest=Math.floor(Math.min(...state.sessions.filter(s=>s.date===d).map(s=>minute(s.start)))/60)*60;const latest=Math.ceil(Math.max(...state.sessions.filter(s=>s.date===d).map(s=>minute(s.end)))/60)*60;const scale=1.25,left=78,col=185;const scroll=el('div','calendar-scroll'),cal=el('div','calendar');cal.style.width=(left+rooms.length*col)+'px';const head=el('div','calendar-header');head.style.gridTemplateColumns=left+'px repeat('+rooms.length+', '+col+'px)';head.append(el('div','','Toronto time'));rooms.forEach(r=>head.append(el('div','',r)));const body=el('div','calendar-body');body.style.height=((latest-earliest)*scale)+'px';for(let t=earliest;t<=latest;t+=60){const y=(t-earliest)*scale;const line=el('div','hour-line');line.style.top=y+'px';body.append(line);const label=el('div','hour-label',clock(String(Math.floor(t/60)).padStart(2,'0')+':00'));label.style.top=y+'px';body.append(label)}rooms.forEach((r,i)=>{const line=el('div','room-line');line.style.left=(left+i*col)+'px';body.append(line)});for(const s of day){const i=rooms.indexOf(s.room||'Room not specified'),start=minute(s.start),end=minute(s.end);const overlaps=day.filter(x=>(x.room||'Room not specified')===(s.room||'Room not specified')&&minute(x.start)<end&&minute(x.end)>start).sort(order);const position=overlaps.findIndex(x=>x.id===s.id);const n=overlaps.length;const width=(col-8)/n;const e=el('button','event');e.style.setProperty('--track',trackColor(s.track));e.style.left=(left+i*col+4+position*width)+'px';e.style.top=((start-earliest)*scale+2)+'px';e.style.width=Math.max(32,width-2)+'px';e.style.height=Math.max(18,(end-start)*scale-4)+'px';e.setAttribute('aria-label',`${s.title}, ${clock(s.start)} to ${clock(s.end)}, ${s.room}. Open details`);add(e,el('span','',clock(s.start)+'–'+clock(s.end)),el('strong','',s.title));e.onclick=()=>openDetail(s);body.append(e)}add(cal,head,body);add(scroll,cal);container.append(scroll,el('p','legend','Scroll horizontally to explore rooms. Select a session block for details and My Agenda actions.'))}}
function conflicts(){const ss=state.sessions.filter(s=>state.saved.has(s.id)).sort(order),found=[];for(let i=0;i<ss.length;i++)for(let j=i+1;j<ss.length;j++){const a=ss[i],b=ss[j];if(a.date===b.date&&minute(a.start)<minute(b.end)&&minute(b.start)<minute(a.end))found.push([a,b])}return found}
function render(){setupFilters();$('savedCount').textContent='('+state.saved.size+')';$('fullNav').classList.toggle('active',state.area==='full');$('mineNav').classList.toggle('active',state.area==='mine');$('viewSwitch').hidden=state.area==='mine';$('filterPanel').hidden=state.area==='mine';$('listBtn').classList.toggle('active',state.view==='list');$('calBtn').classList.toggle('active',state.view==='calendar');const days=$('days');days.replaceChildren();for(const [key,label]of [['all','All Days'],...DAYS.map(d=>[d,dateLabel(d)])]){const b=el('button','btn '+(state.day===key?'active':''),label);b.setAttribute('aria-pressed',String(state.day===key));b.onclick=()=>{state.day=key;render()};days.append(b)}const content=$('content');content.replaceChildren();const warnings=$('conflicts');warnings.replaceChildren();if(!state.loaded)return;let items=state.sessions.filter(s=>(state.day==='all'||s.date===state.day)&&(state.area==='mine'?state.saved.has(s.id):matches(s)));$('meta').textContent=state.area==='mine'?`${items.length} saved session${items.length===1?'':'s'} shown · ${state.saved.size} saved in total`:`${items.length} of ${state.sessions.length} sessions shown`;
if(state.area==='mine'){const pairs=conflicts();for(const [a,b]of pairs)warnings.append(el('div','conflict',`Scheduling conflict: “${a.title}” (${clock(a.start)}–${clock(a.end)}) overlaps “${b.title}” (${clock(b.start)}–${clock(b.end)}) on ${dateLabel(a.date)}.`));const missing=[...state.saved].filter(id=>!state.sessions.some(s=>s.id===id));for(const id of missing){const m=el('div','missing',`Saved session ${id} is no longer in the current published programme.`),remove=el('button','btn danger','Remove saved ID');remove.onclick=()=>toggle(id);m.append(' ',remove);warnings.append(m)}const download=el('button','btn primary','↓ Download My Agenda (.ics)');download.disabled=!state.sessions.some(s=>state.saved.has(s.id));download.onclick=()=>downloadIcs(state.sessions.filter(s=>state.saved.has(s.id)),'future-of-events-summit-2027-my-agenda.ics');warnings.append(download)}
if(!items.length){const empty=el('div','empty');add(empty,el('h3','',state.area==='mine'?'No saved sessions for this day':'No sessions match your selection'),el('p','muted',state.area==='mine'?'Browse the Full Agenda and save sessions you want to attend.':'Try a different search, day or filter.'));const b=el('button','btn primary',state.area==='mine'?'Browse Full Agenda':'Clear Filters');b.onclick=()=>state.area==='mine'?(state.area='full',state.day='all',render()):clearFilters();empty.append(b);content.append(empty);return}if(state.area==='full'&&state.view==='calendar')renderCalendar(items,content);else renderList(items,content)}
let previousFocus=null;function openDetail(s,focus=true){if(focus)previousFocus=document.activeElement;const modal=$('details'),body=$('detailBody');$('detailTitle').textContent=s.title;body.replaceChildren();add(body,chips(s),el('p','',`${dateLabel(s.date)} · ${clock(s.start)}–${clock(s.end)} · Toronto time`));if(s.description)add(body,el('p','',s.description));const buttons=el('div','actions');add(buttons,savedButton(s),exportButton(s));body.append(buttons);const h=el('h3','','Presentations');body.append(h);for(const p of s.presentations){const section=el('section','presentation');add(section,el('div','count',p.start&&p.end?`${clock(p.start)}–${clock(p.end)}`:'Presentation time not specified'),el('h3','',p.title||'Untitled presentation'));if(p.description)section.append(el('p','',p.description));if(p.people.length){const sorted=[...p.people].sort((a,b)=>(a.role.toLowerCase().includes('moderator')?-1:0)-(b.role.toLowerCase().includes('moderator')?-1:0));for(const person of sorted){const line=el('div','speaker');add(line,el('b','',person.role||'Presenter'),document.createTextNode(' · '+person.name+(person.affiliation?' — '+person.affiliation:'')));section.append(line)}}else section.append(el('p','muted','No presenter listed'));body.append(section)}if(!modal.open)modal.showModal();if(focus)$('closeModal').focus()}
$('closeModal').onclick=()=>$('details').close();$('details').addEventListener('close',()=>{if(previousFocus?.isConnected)previousFocus.focus()});$('details').addEventListener('click',e=>{if(e.target===$('details'))$('details').close()});
function escapeIcs(v){return String(v??'').replace(/\\/g,'\\\\').replace(/\r\n|\r|\n/g,'\\n').replace(/;/g,'\\;').replace(/,/g,'\\,')}
function utcStamp(s,t){const [y,m,d]=s.split('-').map(Number),mins=minute(t);const local=Date.UTC(y,m-1,d,Math.floor(mins/60),Math.floor(mins%60));const dt=new Date(local+4*3600000);return dt.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z')}
function fold(line){const encoder=new TextEncoder();const result=[];let part='',bytes=0;for(const char of line){const size=encoder.encode(char).length;if(bytes+size>75){result.push(part);part=' ';bytes=1}part+=char;bytes+=size}result.push(part);return result.join('\r\n')}
function downloadIcs(sessions,name){const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Future of Events Summit//Agenda 2027//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Future of Events Summit 2027'];const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z');for(const s of [...sessions].sort(order)){const description=['Future of Events Summit 2027',s.description,s.track?'Track: '+s.track:'',s.room?'Room: '+s.room:''].filter(Boolean).join('\n');lines.push('BEGIN:VEVENT','UID:'+encodeURIComponent(s.id)+'@future-of-events-summit-2027','DTSTAMP:'+stamp,'DTSTART:'+utcStamp(s.date,s.start),'DTEND:'+utcStamp(s.date,s.end),'SUMMARY:'+escapeIcs(s.title),'DESCRIPTION:'+escapeIcs(description),'LOCATION:'+escapeIcs([s.room,'Toronto, Ontario, Canada'].filter(Boolean).join(', ')),'END:VEVENT')}lines.push('END:VCALENDAR');const text=lines.map(fold).join('\r\n')+'\r\n',blob=new Blob([text],{type:'text/calendar;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('fullNav').onclick=()=>{state.area='full';render()};$('mineNav').onclick=()=>{state.area='mine';render()};$('listBtn').onclick=()=>{state.view='list';render()};$('calBtn').onclick=()=>{state.view='calendar';render()};$('clear').onclick=clearFilters;for(const id of filterIds)$(id).addEventListener(id==='search'?'input':'change',render);load();
</script></body></html>
